<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" role="img" aria-labelledby="title desc">
<title id="title">Jeysson Pacherres — desarrollador y aventurero del código</title>
<desc id="desc">Banner animado con un barco pirata navegando sobre olas, símbolos de programación y el nombre de Jeysson Pacherres.</desc>
<defs>
  <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#101a3a"/><stop offset=".62" stop-color="#174b78"/><stop offset="1" stop-color="#16a7a1"/></linearGradient>
  <linearGradient id="sea" x2="0" y2="1"><stop stop-color="#20b8b2"/><stop offset="1" stop-color="#08365d"/></linearGradient>
  <linearGradient id="gold" x2="1" y2="1"><stop stop-color="#fff2a6"/><stop offset="1" stop-color="#ff9e2c"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <pattern id="stars" width="120" height="90" patternUnits="userSpaceOnUse">
    <circle cx="12" cy="17" r="1.4" fill="#fff" opacity=".75"/><circle cx="73" cy="51" r="1" fill="#fff" opacity=".55"/><path d="M102 13v8m-4-4h8" stroke="#ffe99a" opacity=".7"/>
  </pattern>
</defs>
<style>
  .title{font:900 53px 'Trebuchet MS',Arial,sans-serif;letter-spacing:2px}
  .sub{font:600 17px 'Courier New',monospace;letter-spacing:2px}
  .code{font:700 21px 'Courier New',monospace;fill:#b7fff0}
  .wave{animation:wave 5s ease-in-out infinite alternate;transform-origin:center}
  .wave2{animation:wave 7s ease-in-out infinite alternate-reverse;transform-origin:center}
  .ship{animation:sail 3.5s ease-in-out infinite;transform-origin:550px 230px}
  .spark{animation:blink 2s ease-in-out infinite}
  .cursor{animation:blink .9s steps(2) infinite}
  .float{animation:float 4s ease-in-out infinite}
  @keyframes wave{from{transform:translateX(-22px)}to{transform:translateX(22px)}}
  @keyframes sail{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-8px) rotate(1deg)}}
  @keyframes blink{0%,100%{opacity:.35}50%{opacity:1}}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
</style>
<rect width="1000" height="360" rx="26" fill="url(#sky)"/>
<rect width="1000" height="270" rx="26" fill="url(#stars)"/>
<circle cx="865" cy="82" r="44" fill="#ffd66b" opacity=".95" filter="url(#glow)"/>
<circle cx="850" cy="68" r="43" fill="#18264a"/>
<g class="spark" fill="#fff2a6"><path d="M780 57v16m-8-8h16"/><path d="M942 140v12m-6-6h12"/><circle cx="730" cy="105" r="3"/></g>
<text x="52" y="75" class="sub" fill="#ffe99a">✦ BLACK CODE CREW  /  PIURA, PERÚ</text>
<text x="48" y="151" class="title" fill="#fff" stroke="#102040" stroke-width="5" paint-order="stroke">JEYSSON</text>
<text x="48" y="211" class="title" fill="url(#gold)" stroke="#102040" stroke-width="5" paint-order="stroke">PACHERRES</text>
<text x="54" y="247" class="sub" fill="#d8fff5">BACKEND  •  AUTOMATIZACIÓN  •  IA</text>
<text x="55" y="287" class="code">&lt;build_future /&gt;<tspan class="cursor">_</tspan></text>
<g class="float">
<text x="440" y="102" class="code" opacity=".8">&lt;code/&gt;</text>
<text x="813" y="208" class="code" opacity=".9">{ n8n + IA }</text>
</g>
<path d="M0 260 Q120 236 240 260 T480 260 T720 260 T1000 260 V360 H0Z" fill="url(#sea)"/>
<g class="wave" fill="none" stroke="#8bfff0" stroke-width="3" opacity=".55"><path d="M-20 282q55-22 110 0t110 0t110 0t110 0t110 0t110 0t110 0t110 0t110 0"/></g>
<g class="ship">
  <path d="M460 250 L660 250 L620 292 Q560 310 500 290Z" fill="#402b39" stroke="#ffcf6e" stroke-width="4"/>
  <path d="M548 245V132" stroke="#f8e6bd" stroke-width="8"/>
  <path d="M538 142 Q486 158 488 226 L538 226Z" fill="#fff4d6" stroke="#372d3e" stroke-width="4"/>
  <path d="M558 151 Q615 161 630 224 L558 224Z" fill="#ffbd4a" stroke="#372d3e" stroke-width="4"/>
  <path d="M541 149 Q511 158 514 213 Q540 203 541 149Z" fill="#ed5962" opacity=".9"/>
  <path d="M570 248 Q584 265 600 248" fill="none" stroke="#ffe19b" stroke-width="3"/>
  <circle cx="572" cy="270" r="4" fill="#ffe19b"/><circle cx="596" cy="270" r="4" fill="#ffe19b"/>
  <path d="M550 126l20 8-20 8Z" fill="#ef5962"/>
  <g transform="translate(592 183)" fill="#402b39">
    <circle r="12"/><circle cx="-4" cy="-2" r="2.5" fill="#ffe19b"/><circle cx="4" cy="-2" r="2.5" fill="#ffe19b"/>
    <path d="M-5 5h10l-2 5h-6Z" fill="#ffe19b"/>
  </g>
</g>
<path class="wave2" d="M0 306 Q130 280 260 306 T520 306 T780 306 T1040 306 V360 H0Z" fill="#092e54" opacity=".88"/>
<g fill="none" stroke="#55e1d0" stroke-width="3" opacity=".8"><path d="M32 329q40-17 80 0t80 0t80 0t80 0t80 0t80 0t80 0t80 0t80 0t80 0"/></g>
<rect x="18" y="18" width="964" height="324" rx="20" fill="none" stroke="#fff" opacity=".18" stroke-width="2"/>
</svg>